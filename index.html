<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Project Metamorphosis</title>
    <meta name="description" content="Personal athletic training system and 30-day cycle tracker designed as an offline-first iPhone PWA." />
    <meta property="og:title" content="Project Metamorphosis" />
    <meta property="og:description" content="Personal athletic training system and 30-day cycle tracker designed as an offline-first iPhone PWA." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Metamorphosis" />
  </head>
  <body class="bg-black text-white select-none">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then(
            (reg) => console.log('SW registered', reg.scope),
            (err) => console.log('SW registration error', err)
          );
        });
      }
    </script>
  </body>
</html>
